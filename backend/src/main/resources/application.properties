spring.application.name=pminternship-backend
server.port=${PORT:8080}

# =========================================================
# POSTGRESQL DATABASE
# =========================================================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# =========================================================
# JPA
# =========================================================

spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# =========================================================
# JWT
# =========================================================

app.jwt.secret=${JWT_SECRET:9a2f8c4e7b1d503862491a7c3e5f80b2d4e6f1a9c8b7d6e5f4a3b2c1d0e9f8a7}
app.jwt.expiration-ms=86400000

# =========================================================
# LOGGING
# =========================================================

logging.level.com.pminternship.backend=INFO
logging.level.org.springframework.security=INFO